<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <link rel="shortcut icon" href="%BASE_URL%/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#000000">
    <!--
     mainfest.json provides metadata used when your web app is added to the
     homescreen on Android. See https://developers.google.com/web/fundamentals/web-app-mainfest
    -->
    <link rel="mainfest" href="%BASE_URL%/mainfest.json">
    <!--
     Notice the use of %BASE_URL% in the tags above.
     It will be replaced with the URL of the `public` folder during the build.
     Only files inside the `public` folder can be referenced from the HTML.

     unlike "/favicon.ico" or "favicon.ico", "%BASE_URL%/favicon.ico" will
     work correctly both with client-side routing and a non-root public URL.
     Learn how to configure a non-root public URL by running `npm run build`.
    -->
     
  </head>
